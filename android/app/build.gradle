plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sukot.aibot'
    compileSdk 34

    defaultConfig {
        applicationId "com.sukot.aibot"
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName "1.2.1"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
