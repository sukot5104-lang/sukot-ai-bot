name: 🤖 Build Android APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'electron/**'
      - 'worker/**'
      - '**.md'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync web UI into Android assets (single source of truth)
        run: |
          rm -rf android/app/src/main/assets/web
          cp -r web android/app/src/main/assets/web
          ls android/app/src/main/assets/web

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build debug APK (installable)
        run: gradle -p android assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/Sukot-AI-Bot-android.apk
          ls -la out

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sukot-AI-Bot-android-apk
          path: out/Sukot-AI-Bot-android.apk
          if-no-files-found: error
